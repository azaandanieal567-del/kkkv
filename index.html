    <script>
      // Make window.fetch writable so browser extensions and interceptors can patch it without throwing getter-only TypeError
      (function() {
        try {
          var _origFetch = window.fetch;
          var _currFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _currFetch; },
            set: function(fn) { _currFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // pass
        }
      })();
    </script>
